name: Update and publish Morning Alpha

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update news cache
        run: python update_news.py

      - name: Save updated cache
        run: |
          git config user.name "morning-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news_cache.json
          git diff --cached --quiet || git commit -m "chore: update news cache"
          git push || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
